[mgr]
sort_by        = "natural"
sort_reverse 	 = false
[opener]

# edit = [
  # { run = 'nvim "$@"', block = true, desc = "nvim" },
  # { run = 'setsid foot nvim "$@" > /dev/null 2>&1 &', block = true, desc = "nvim-in-seperate-window" },
# ]

pdf-open = [{ run = "setsid zathura %s1" , desc = "pdf-open" , for = "linux"}]

image-open = [
	{ run = "setsid pinta %s1 > /dev/null 2>&1 &", desc = "pinta", for = "linux" },
]

[open]

prepend_rules = [
  { url = "*.pdf" , use = [ "pdf-open"] },
  # Enter/O default stays "open" (xdg-open -> nsxiv/nsxiv-gif via xdg-mime),
  # pinta is only an extra choice in the `o` picker:
  { mime = "image/*", use = [ "open", "image-open", "reveal" ] }
]
