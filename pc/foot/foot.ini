[main]
# JetBrainsMono Nerd Font at size 12
# Style variants (bold/italic) are handled automatically by foot if available.
font=JetBrainsMono Nerd Font:size=13
pad=0x0
# hide-window-decorations = yes

[csd]
# Decorations are handled by your Wayland compositor. To disable them entirely:
# preferred=none
# To hide just the titlebar while keeping a border:
# size=0

[cursor]
# foot uses a blink rate in milliseconds (0.5 seconds = 500ms)
style=block
blink=yes
# Note: foot doesn't have a direct equivalent to stop_blinking_after

[scrollback]
lines=2000

[mouse]
# wheel_scroll_min_lines = 1 (foot handles mouse scrolling smoothly by default)

[bell]
urgent=no
notify=no
visual=no

[colors-dark]
# background_opacity = 0.7 (alpha channel for background)
alpha=0.7
# background=24273a

# selection_foreground = none
# selection_background = none
# (foot uses default high-contrast selection if not specified)
